{% extends "base/admin_base.html" %}
{% block page_title %}Issue book{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Issue book</h1><div class="text-muted">{{ book.title }} · {{ book.available_copies }} available</div></div><a class="btn btn-outline-secondary" href="{{ url_for('library.index') }}">Back</a></div>
<form class="panel-card" method="get" class="mb-3"><div class="row g-2"><div class="col-12 col-md-6"><label class="form-label" for="member-kind">Member type</label><select id="member-kind" class="form-select" name="member_kind" onchange="this.form.submit()">{% for key, label in member_kinds %}<option value="{{ key }}" {% if kind == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div></form>
<form class="panel-card mt-3" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="member_kind" value="{{ kind }}">
<div class="row g-3"><div class="col-12"><label class="form-label" for="member">Member *</label><select id="member" class="form-select" name="member_id" required><option value="">Choose member</option>{% for m in members %}<option value="{{ m.id }}">{{ m.full_name }}{% if kind == 'student' %} · {{ m.student_code }}{% else %} · {{ m.employee_code }}{% endif %}</option>{% endfor %}</select></div>
<div class="col-12 col-md-6"><label class="form-label" for="due">Due date *</label><input id="due" class="form-control" type="date" name="due_date" value="{{ default_due }}" required></div>
<div class="col-12"><label class="form-label" for="notes">Notes</label><textarea id="notes" class="form-control" name="notes" rows="3"></textarea></div></div>
<div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('library.index') }}">Cancel</a><button class="btn btn-em" type="submit">Issue book</button></div></form>{% endblock %}
