{% extends "base/admin_base.html" %}
{% block page_title %}{{ 'Edit' if item else 'Schedule' }} online class{% endblock %}
{% block content %}<div class="page-head"><div><h1>{{ 'Edit' if item else 'Schedule' }} online class</h1></div><a class="btn btn-outline-secondary" href="{{ url_for('online.classes') }}">Back</a></div>
<form class="panel-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
{% if batches %}<div class="col-12"><label class="form-label" for="batch">Batch *</label><select id="batch" class="form-select" name="batch_id" required><option value="">Choose batch</option>{% for b in batches %}<option value="{{ b.id }}">{{ b.name }} · {{ b.subject.name }}</option>{% endfor %}</select></div>{% endif %}
<div class="col-12"><label class="form-label" for="title">Title *</label><input id="title" class="form-control" name="title" value="{{ form.title or (item.title if item else '') }}" required></div>
<div class="col-12"><label class="form-label" for="url">Meeting URL *</label><input id="url" class="form-control" type="url" name="meeting_url" value="{{ form.meeting_url or (item.meeting_url if item else '') }}" placeholder="https://meet.google.com/..." required></div>
<div class="col-12 col-md-6"><label class="form-label" for="starts">Starts at *</label><input id="starts" class="form-control" type="datetime-local" name="starts_at" value="{{ form.starts_at or (item.starts_at.strftime('%Y-%m-%dT%H:%M') if item else '') }}" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="duration">Duration (minutes) *</label><input id="duration" class="form-control" type="number" min="15" max="600" name="duration_min" value="{{ form.duration_min or (item.duration_min if item else 60) }}" required></div>
<div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" class="form-control" name="description" rows="3">{{ form.description or (item.description if item else '') }}</textarea></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('online.classes') }}">Cancel</a><button class="btn btn-em" type="submit">Save class</button></div></form>{% endblock %}
