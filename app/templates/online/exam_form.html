{% extends "base/admin_base.html" %}
{% block page_title %}Create online exam{% endblock %}
{% block content %}<div class="page-head"><div><h1>Create online exam</h1></div><a class="btn btn-outline-secondary" href="{{ url_for('online.exams') }}">Back</a></div>
<form class="panel-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-12"><label class="form-label" for="batch">Batch *</label><select id="batch" class="form-select" name="batch_id" required><option value="">Choose batch</option>{% for b in batches %}<option value="{{ b.id }}">{{ b.name }} · {{ b.subject.name }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label" for="title">Exam title *</label><input id="title" class="form-control" name="title" value="{{ form.title or '' }}" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="starts">Starts at *</label><input id="starts" class="form-control" type="datetime-local" name="starts_at" value="{{ form.starts_at or '' }}" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="ends">Ends at *</label><input id="ends" class="form-control" type="datetime-local" name="ends_at" value="{{ form.ends_at or '' }}" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="duration">Duration (minutes) *</label><input id="duration" class="form-control" type="number" min="5" max="360" name="duration_min" value="{{ form.duration_min or 30 }}" required></div>
<div class="col-12 col-md-6"><label class="form-label" for="pass">Passing marks *</label><input id="pass" class="form-control" type="number" min="0" step="0.01" name="pass_marks" value="{{ form.pass_marks or 0 }}" required></div>
<div class="col-12"><label class="form-label" for="instructions">Instructions</label><textarea id="instructions" class="form-control" name="instructions" rows="4">{{ form.instructions or '' }}</textarea></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('online.exams') }}">Cancel</a><button class="btn btn-em" type="submit">Create exam</button></div></form>{% endblock %}
