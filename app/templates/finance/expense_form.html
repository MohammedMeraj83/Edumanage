{% extends "base/admin_base.html" %}
{% block page_title %}Add expense{% endblock %}
{% block content %}
<div class="page-head"><h1>Add expense</h1></div>
<form method="post" enctype="multipart/form-data" class="panel-card" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    {% if branches %}<div class="col-12 col-md-4"><label class="form-label" for="branch_id">Branch</label><select class="form-select" id="branch_id" name="branch_id" required>{% for b in branches %}<option value="{{ b.id }}" {{ 'selected' if (request.form.get('branch_id')|string) == (b.id|string) }}>{{ b.name }}</option>{% endfor %}</select></div>{% endif %}
    <div class="col-12 col-md-4"><label class="form-label" for="category_id">Category</label><select class="form-select" id="category_id" name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if (request.form.get('category_id')|string) == (c.id|string) }}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-2"><label class="form-label" for="amount">Amount (₹)</label><input class="form-control" id="amount" name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" value="{{ request.form.get('amount', '') }}" required></div>
    <div class="col-6 col-md-2"><label class="form-label" for="expense_date">Date</label><input class="form-control" id="expense_date" name="expense_date" type="date" max="{{ today.isoformat() }}" value="{{ request.form.get('expense_date', today.isoformat()) }}"></div>
    <div class="col-12 col-md-8"><label class="form-label" for="description">What was it for?</label><input class="form-control" id="description" name="description" maxlength="250" value="{{ request.form.get('description', '') }}" required></div>
    <div class="col-12 col-md-4"><label class="form-label" for="vendor">Paid to (optional)</label><input class="form-control" id="vendor" name="vendor" maxlength="120" value="{{ request.form.get('vendor', '') }}"></div>
    <div class="col-6 col-md-4"><label class="form-label" for="mode">Paid by</label><select class="form-select" id="mode" name="mode">{% for v, l in modes %}<option value="{{ v }}" {{ 'selected' if request.form.get('mode') == v }}>{{ l }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-4"><label class="form-label" for="reference">Bill / transaction no. (optional)</label><input class="form-control" id="reference" name="reference" maxlength="80" value="{{ request.form.get('reference', '') }}"></div>
    <div class="col-12 col-md-4"><label class="form-label" for="bill">Bill photo or PDF (optional)</label><input class="form-control" id="bill" name="bill" type="file" accept=".pdf,image/png,image/jpeg,image/webp"></div>
  </div>
  <div class="d-flex gap-2 mt-4 stack-sm"><button class="btn btn-em">Save expense</button><a class="btn btn-outline-secondary" href="{{ url_for('finance.expenses') }}">Cancel</a></div>
</form>
{% endblock %}
